name: Eslint Check

on: pull_request

jobs:
  Jest:
    name: Eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Running Eslint
        run: npm run eslint:check
