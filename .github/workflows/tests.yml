name: Automated Tests

on: pull_request

jobs:
  Jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Running Tests
        run: npm test
