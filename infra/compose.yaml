name: clone-tabnews
services:
  database:
    container_name: tabnews-dev
    image: postgres:16.15-alpine
    env_file:
      - ../.env.development
    ports:
      - ${POSTGRES_PORT}:5432
  mailcatcher:
    container_name: mailcatcher-dev
    image: sj26/mailcatcher
    env_file:
      - ../.env.development
    ports:
      - ${SMTP_HTTP_PORT}:1080
      - ${SMTP_PORT}:1025
